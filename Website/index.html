            handX = lerp(-24, holX + 3, pHol);
            handY = lerp(0, holY - 2, pHol);
            gunAngle = lerp(0, -1.45, pHol);
          } else {
            // Act 6 & 7: Relaxed swagger arm at side while stepping onto ending sticker
            var swing = stepPhase > 0 && stepPhase < 1 ? Math.sin(stepPhase * Math.PI) * 4 : 0;
            handX = shoulderX + 4;
            handY = shoulderY + 17 - swing;
          }

          // Compute exact world-space barrel tip for Act 2 muzzle flashes & bullet tracers
          var tipRelX = handX + (Math.cos(gunAngle) * (-28) - Math.sin(gunAngle) * (-2.5)) * 0.92;
          var tipRelY = handY + (Math.sin(gunAngle) * (-28) + Math.cos(gunAngle) * (-2.5)) * 0.92;
          muzzleWorldX = rx + tipRelX * bodyScale;
          muzzleWorldY = ry + tipRelY * bodyScale;
          activeGunAngle = gunAngle;

          // Draw right arm (shoulder -> hand)
          ctx.strokeStyle = INK;
          ctx.lineWidth = 9.5;
          ctx.beginPath();
          ctx.moveTo(shoulderX, shoulderY);
          ctx.quadraticCurveTo((shoulderX + handX) * 0.5 + 4, (shoulderY + handY) * 0.5 + 4, handX, handY);
          ctx.stroke();

          ctx.strokeStyle = PINK;
          ctx.lineWidth = 5.2;
          ctx.beginPath();
          ctx.moveTo(shoulderX, shoulderY);
          ctx.quadraticCurveTo((shoulderX + handX) * 0.5 + 4, (shoulderY + handY) * 0.5 + 4, handX, handY);
          ctx.stroke();
          ctx.strokeStyle = INK;
          ctx.lineWidth = 2.8;

          if (drawGun) {
            drawRevolver(ctx, handX, handY, gunAngle, 0.92, spinBlur);
          }

          // Act 3: Barrel smoke + mouth blowing breath streaks & drifting smoke rings
          if (t >= tShootEnd - 0.05 && t < tTrickEnd) {
            var tipLocalX = handX + Math.cos(gunAngle) * (-28) - Math.sin(gunAngle) * (-3);
            var tipLocalY = handY + Math.sin(gunAngle) * (-28) + Math.cos(gunAngle) * (-3);

            var wispAlpha = t < tBlowEnd ? 0.55 : Math.max(0, 0.55 - (t - tBlowEnd) * 2);
            if (wispAlpha > 0.02) {
              ctx.strokeStyle = "rgba(148, 163, 184, " + wispAlpha.toFixed(2) + ")";
              ctx.lineWidth = 2.2;
              ctx.beginPath();
              var wave = Math.sin(t * 14) * 3;
              ctx.moveTo(tipLocalX, tipLocalY);
              ctx.quadraticCurveTo(tipLocalX - 4 + wave, tipLocalY - 10, tipLocalX - 2 - wave, tipLocalY - 20);
              ctx.stroke();
            }

            if (t >= tShootEnd + 0.22 && t < tBlowEnd + 0.18) {
              var pBlow = clamp01((t - (tShootEnd + 0.22)) / 0.58);
              if (pBlow < 0.72) {
                var bAlpha = Math.sin((pBlow / 0.72) * Math.PI) * 0.75;
                ctx.strokeStyle = "rgba(100, 116, 139, " + bAlpha.toFixed(2) + ")";
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(faceShiftX - 10, headY + 9);
                ctx.lineTo(faceShiftX - 26 - pBlow * 12, headY + 6);
                ctx.moveTo(faceShiftX - 10, headY + 11);
                ctx.lineTo(faceShiftX - 24 - pBlow * 14, headY + 13);
                ctx.stroke();
              }

              for (var sm = 0; sm < 3; sm++) {
                var smP = clamp01((pBlow - sm * 0.16) / 0.7);
                if (smP > 0 && smP < 1) {
                  var sx = tipLocalX - 6 - smP * 34;
                  var sy = tipLocalY - 3 - smP * 12 + Math.sin(smP * 6 + sm) * 3;
                  var sr = 4 + smP * 8;
                  ctx.strokeStyle = "rgba(148, 163, 184, " + ((1 - smP) * 0.75).toFixed(2) + ")";
                  ctx.fillStyle = "rgba(226, 232, 240, " + ((1 - smP) * 0.45).toFixed(2) + ")";
                  ctx.lineWidth = 2;
                  ctx.beginPath();
                  ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                  ctx.fill();
                  ctx.stroke();
                }
              }
            }
          }

          // Sparkle glints on Revolver Trick catch (Act 4) & Holster click (Act 5)
          if (t >= tTrickEnd - 0.18 && t < tTrickEnd + 0.06) {
            var sp1 = Math.sin(clamp01((t - (tTrickEnd - 0.18)) / 0.24) * Math.PI);
            drawStarSparkle(ctx, -28, -24, 10 * sp1, "#fde047");
          }
          if (t >= 4.06 && t < 4.28) {
            var sp2 = Math.sin(clamp01((t - 4.06) / 0.22) * Math.PI);
            drawStarSparkle(ctx, holX + 5, holY + 1, 8.5 * sp2, "#fde047");
          }

          ctx.restore(); // end rabbit local space
        }

        // 5. World-space Sky Gunfire & Fizzy Soda Splash VFX for Act 2
        for (var k2 = 0; k2 < shotTimes.length; k2++) {
          var dt = t - shotTimes[k2];
          if (dt < 0 || dt > 0.48) continue;
          var hitCan = canStates[k2];
          var hitX = hitCan.apexX;
          var hitY = hitCan.apexY;
          var isCoke = hitCan.spec.brand === "coke";

          // (a) Angled jagged muzzle flash aligned with upward revolver barrel (first 75ms)
          if (dt < 0.075) {
            var mf = 1 - dt / 0.075;
            ctx.save();
            ctx.translate(muzzleWorldX, muzzleWorldY);
            ctx.rotate(activeGunAngle);
            ctx.fillStyle = "#f97316";
            ctx.beginPath();
            ctx.moveTo(4, 0);
            ctx.lineTo(-18 * mf - 6, -10 * mf);
            ctx.lineTo(-10 * mf - 2, -2);
            ctx.lineTo(-26 * mf - 8, 0);
            ctx.lineTo(-10 * mf - 2, 2);
            ctx.lineTo(-18 * mf - 6, 10 * mf);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#fef08a";
            ctx.beginPath();
            ctx.arc(-6, 0, 5.5 * mf, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // (b) High-speed golden bullet tracer streaking skyward to the Pepsi / Coca-Cola can (0 -> 90ms)
          if (dt < 0.09) {
            var bp = dt / 0.09;
            var bx1 = lerp(muzzleWorldX, hitX, bp);
            var by1 = lerp(muzzleWorldY, hitY, bp);
            var bx0 = lerp(muzzleWorldX, hitX, Math.max(0, bp - 0.34));
            var by0 = lerp(muzzleWorldY, hitY, Math.max(0, bp - 0.34));

            ctx.save();
            ctx.strokeStyle = "#f59e0b";
            ctx.lineWidth = 4.2;
            ctx.beginPath();
            ctx.moveTo(bx0, by0);
            ctx.lineTo(bx1, by1);
            ctx.stroke();

            ctx.strokeStyle = "#fef9c3";
            ctx.lineWidth = 1.9;
            ctx.beginPath();
            ctx.moveTo(bx0, by0);
            ctx.lineTo(bx1, by1);
            ctx.stroke();
            ctx.restore();
          }

          // (c) Carbonated Soda Burst + Starburst + "BANG!" in the sky (0 -> 380ms)
          if (dt < 0.38) {
            var spP = dt / 0.38;
            // Expanding soda shock ring
            ctx.save();
            ctx.strokeStyle = isCoke
              ? "rgba(220, 38, 38, " + ((1 - spP) * 0.65).toFixed(2) + ")"
              : "rgba(37, 99, 235, " + ((1 - spP) * 0.65).toFixed(2) + ")";
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.arc(hitX, hitY, (10 + spP * 32) * S, 0, Math.PI * 2);
            ctx.stroke();

            // 8 pressurized fizzy soda droplets & white foam bubbles spraying outward
            for (var dr = 0; dr < 8; dr++) {
              var dAng = -Math.PI * 0.88 + (dr / 7) * Math.PI * 1.45 + k2 * 0.25;
              var dSpd = (34 + (dr % 3) * 16) * S;
              var dxD = hitX + Math.cos(dAng) * dSpd * spP;
              var dyD = hitY + Math.sin(dAng) * dSpd * spP + 58 * S * spP * spP;
              var dRad = (1 - spP * 0.72) * (dr % 2 === 0 ? 4.2 : 3.1) * S;
              ctx.fillStyle = dr % 3 === 0
                ? "#ffffff"
                : (isCoke ? (dr % 2 === 0 ? "#78350f" : "#ef4444") : (dr % 2 === 0 ? "#38bdf8" : "#1d4ed8"));
              ctx.globalAlpha = canvasAlpha * (1 - spP);
              ctx.beginPath();
              ctx.arc(dxD, dyD, Math.max(0.8, dRad), 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }

          if (dt >= 0.02 && dt < 0.28) {
            var ip = (dt - 0.02) / 0.26;
            drawStarSparkle(ctx, hitX, hitY, (15 * Math.sin(ip * Math.PI)) * S, isCoke ? "#fde047" : "#38bdf8");

            ctx.save();
            ctx.globalAlpha = canvasAlpha * (1 - ip);
            ctx.font = "700 " + Math.round(12 * S) + "px 'Space Grotesk', system-ui, sans-serif";
            ctx.lineJoin = "round";
            ctx.strokeStyle = "#18181b";
            ctx.lineWidth = 3 * S;
            ctx.strokeText("BANG!", hitX - 16 * S, hitY - (16 + ip * 12) * S);
            ctx.fillStyle = isCoke ? "#f87171" : "#60a5fa";
            ctx.fillText("BANG!", hitX - 16 * S, hitY - (16 + ip * 12) * S);
            ctx.restore();
          }

          // (d) Spinning brass shell casing ejecting up-right from revolver
          if (dt < 0.38) {
            var cp = dt / 0.38;
            var cxCase = muzzleWorldX + 20 * bodyScale + cp * 26 * S;
            var cyCase = muzzleWorldY + 4 * bodyScale + (-36 * cp + 94 * cp * cp) * S;
            ctx.save();
            ctx.translate(cxCase, cyCase);
            ctx.rotate(cp * 11);
            ctx.fillStyle = "#facc15";
            ctx.strokeStyle = "#18181b";
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.roundRect(-3.5, -1.8, 7, 3.6, 1);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }
        }

        ctx.restore();
        return false;
      }

      function nextFrame(fn) {
        return window.requestAnimationFrame ? window.requestAnimationFrame(fn) : setTimeout(fn, 16);
      }

      function cancelFrame(id) {
        if (!id) return;
        if (window.cancelAnimationFrame) window.cancelAnimationFrame(id);
        else clearTimeout(id);
      }

      function startRabbitGunslingerCutscene() {
        stopRabbitCutscene();
        var mediaWrap = document.getElementById("finalMedia");
        var detailsEl = document.getElementById("finalDetails");
        if (mediaWrap) mediaWrap.style.opacity = "0";
        if (detailsEl) detailsEl.style.opacity = "0";
        // Use Date.now() consistently to avoid cross-origin iframe rAF timestamp epoch mismatches on iOS Safari
        rabbitState = { startMs: Date.now() };

        function tick() {
          if (!rabbitState) return;
          var elapsed = (Date.now() - rabbitState.startMs) / 1000;
          var finished = renderRabbitCutsceneFrame(elapsed);
          if (!finished) {
            rabbitRaf = nextFrame(tick);
          } else {
            rabbitRaf = 0;
            rabbitState = null;
          }
        }
        rabbitRaf = nextFrame(tick);
      }

      // Cross-browser, iframe-safe requestAnimationFrame keyframe engine (works in iOS Safari, Google Sites iframes, and Reduce Motion)
      function animateRaf(el, frames, durationMs, fillForwards, onFinish) {
        if (!el || !frames || frames.length < 2) {
          if (onFinish) onFinish();
          return null;
        }
        var startClock = Date.now();
        var cancelled = false;
        var rafId = 0;

        function easeSeg(u, mode) {
          if (mode === "out") { var inv = 1 - u; return 1 - inv * inv * inv; }
          if (mode === "in") return u * u;
          if (mode === "inout") return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
          return u;
        }

        function applyAt(p) {
          var k0 = frames[0], k1 = frames[frames.length - 1];
          for (var i = 0; i < frames.length - 1; i++) {
            if (p >= frames[i].o && p <= frames[i + 1].o) {
              k0 = frames[i];
              k1 = frames[i + 1];
              break;
            }
          }
          var span = (k1.o - k0.o) || 1;
          var u = easeSeg(clamp01((p - k0.o) / span), k0.ease);

          var parts = [];
          if (k0.persp || k1.persp) {
            parts.push("perspective(" + (k0.persp || k1.persp) + "px)");
          }
          if (k0.tx !== undefined || k1.tx !== undefined || k0.ty !== undefined || k1.ty !== undefined) {
            var tx = lerp(k0.tx || 0, k1.tx || 0, u);
            var ty = lerp(k0.ty || 0, k1.ty || 0, u);
            parts.push("translate3d(" + tx.toFixed(2) + "px," + ty.toFixed(2) + "px,0)");
          }
          if (k0.rx !== undefined || k1.rx !== undefined) {
            parts.push("rotateX(" + lerp(k0.rx || 0, k1.rx || 0, u).toFixed(2) + "deg)");
          }
          if (k0.skx !== undefined || k1.skx !== undefined) {
            parts.push("skewX(" + lerp(k0.skx || 0, k1.skx || 0, u).toFixed(2) + "deg)");
          }
          if (k0.s !== undefined || k1.s !== undefined || k0.sx !== undefined || k1.sx !== undefined || k0.sy !== undefined || k1.sy !== undefined) {
            var sx0 = k0.sx !== undefined ? k0.sx : (k0.s !== undefined ? k0.s : 1);
            var sy0 = k0.sy !== undefined ? k0.sy : (k0.s !== undefined ? k0.s : sx0);
            var sx1 = k1.sx !== undefined ? k1.sx : (k1.s !== undefined ? k1.s : 1);
            var sy1 = k1.sy !== undefined ? k1.sy : (k1.s !== undefined ? k1.s : sx1);
            parts.push("scale(" + lerp(sx0, sx1, u).toFixed(3) + "," + lerp(sy0, sy1, u).toFixed(3) + ")");
          }
          if (k0.rot !== undefined || k1.rot !== undefined) {
            parts.push("rotate(" + lerp(k0.rot || 0, k1.rot || 0, u).toFixed(2) + "deg)");
          }
          if (parts.length) {
            var tf = parts.join(" ");
            el.style.webkitTransform = tf;
            el.style.transform = tf;
          }
          if (k0.op !== undefined || k1.op !== undefined) {
            var op0 = k0.op !== undefined ? k0.op : 1;
            var op1 = k1.op !== undefined ? k1.op : 1;
            el.style.opacity = lerp(op0, op1, u).toFixed(3);
          }
          if (k0.h !== undefined || k1.h !== undefined) {
            el.style.height = Math.max(0, lerp(k0.h, k1.h, u)).toFixed(1) + "px";
          }
          if (k0.pt !== undefined || k1.pt !== undefined) {
            el.style.paddingTop = Math.max(0, lerp(k0.pt, k1.pt, u)).toFixed(1) + "px";
          }
          if (k0.pb !== undefined || k1.pb !== undefined) {
            el.style.paddingBottom = Math.max(0, lerp(k0.pb, k1.pb, u)).toFixed(1) + "px";
          }
          if (k0.bw !== undefined || k1.bw !== undefined) {
            el.style.borderWidth = Math.max(0, lerp(k0.bw, k1.bw, u)).toFixed(2) + "px";
          }
        }

        applyAt(0);

        function step() {
          if (cancelled) return;
          var p = clamp01((Date.now() - startClock) / durationMs);
          applyAt(p);
          if (p < 1) {
            rafId = nextFrame(step);
          } else {
            if (!fillForwards) {
              el.style.webkitTransform = "";
              el.style.transform = "";
              el.style.opacity = "";
            }
            if (onFinish) onFinish();
          }
        }

        rafId = nextFrame(step);
        var handle = {
          cancel: function () {
            if (cancelled) return;
            cancelled = true;
            cancelFrame(rafId);
            el.style.webkitTransform = "";
            el.style.transform = "";
            el.style.opacity = "";
          }
        };
        activeAnims.push(handle);
        return handle;
      }

      function clearActiveAnims() {
        if (finishTimer) {
          clearTimeout(finishTimer);
          finishTimer = 0;
        }
        stopRabbitCutscene();
        while (activeAnims.length) {
          var a = activeAnims.pop();
          try { a.cancel(); } catch (_) {}
        }
        resetStageInlineStyles();
      }

      // Build the two fighter slots inside #faces and run the winner-beats-loser choreography
      function showRoundClash(youMove, aiMove, result, lineText, predictedRight) {
        clearActiveAnims();

        var arena = document.getElementById("arena");
        var faces = document.getElementById("faces");
        var outcomeArea = document.getElementById("outcomeArea");
        var mediaWrap = document.getElementById("aiMediaWrap");
        var aiImg = document.getElementById("aiWinImg");
        var q = document.getElementById("quip");
        var called = document.getElementById("called");

        arena.className = "arena" + (result === "ai" ? " outcome-ai" : (result === "you" ? " outcome-you" : ""));

        var winnerMove = result === "you" ? youMove : (result === "ai" ? aiMove : null);
        var pillText = result === "draw"
          ? "⚡ CLASH"
          : EMOJI[winnerMove] + " " + BEAT_VERBS[winnerMove] + " " + EMOJI[result === "you" ? aiMove : youMove];
        var pillClass = "action-pill" + (result === "you" ? " pill-you" : (result === "ai" ? " pill-ai" : ""));

        // Impact visual HTML placed on the defeated hand
        var impactHtml = "";
        if (winnerMove === 0) {
          impactHtml = "<span class=\"impact-ring-outer\"></span><span class=\"impact-ring ring-crush\"></span><span class=\"impact-badge\">💥</span>";
        } else if (winnerMove === 1) {
          impactHtml = "<span class=\"impact-ring-outer\"></span><span class=\"impact-ring ring-cover\"></span><span class=\"impact-badge\">💨</span>";
        } else if (winnerMove === 2) {
          impactHtml = "<span class=\"impact-slash\"></span><span class=\"impact-slash-alt\"></span><span class=\"impact-badge\">✂️</span>";
        } else {
          impactHtml = "<span class=\"impact-badge\">⚡</span>";
        }

        faces.innerHTML =
          "<div class=\"fighter" + (result === "you" ? " is-winner" : (result === "ai" ? " is-loser" : "")) + "\" id=\"fYou\">" +
            "<small>YOU</small>" +
            "<span class=\"stage-slot\">" +
              (result === "you" ? "<span class=\"winner-aura\" id=\"winAura\" aria-hidden=\"true\"></span>" : "") +
              "<span class=\"hand\" id=\"handYou\">" + EMOJI[youMove] + "</span>" +
              (result === "ai" ? "<span class=\"impact-fx\" id=\"impactFx\" aria-hidden=\"true\">" + impactHtml + "</span>" : "") +
            "</span>" +
          "</div>" +
          "<div class=\"vs-col\">" +
            "<span class=\"vs\" id=\"vsCenter\">vs</span>" +
            "<span class=\"" + pillClass + "\" id=\"actionPill\">" + pillText + "</span>" +
          "</div>" +
          "<div class=\"fighter" + (result === "ai" ? " is-winner" : (result === "you" ? " is-loser" : "")) + "\" id=\"fAi\">" +
            "<small>AI</small>" +
            "<span class=\"stage-slot\">" +
              (result === "ai" ? "<span class=\"winner-aura\" id=\"winAura\" aria-hidden=\"true\"></span>" : "") +
              "<span class=\"hand\" id=\"handAi\">" + EMOJI[aiMove] + "</span>" +
              (result === "you" ? "<span class=\"impact-fx\" id=\"impactFx\" aria-hidden=\"true\">" + impactHtml + "</span>" : "") +
            "</span>" +
          "</div>";

        // Update quip + AI round-win sticker banner (Images 1-7)
        if (result === "ai") {
          var chosenMedia = drawRoundWinMedia();
          aiImg.src = chosenMedia.src;
          aiImg.alt = chosenMedia.alt;
          mediaWrap.hidden = false;
          outcomeArea.classList.add("has-media");
          q.textContent = "😈 " + lineText;
          q.className = "quip win";
        } else if (result === "you") {
          mediaWrap.hidden = true;
          outcomeArea.classList.remove("has-media");
          q.textContent = "🎉 " + lineText;
          q.className = "quip lose";
        } else {
          mediaWrap.hidden = true;
          outcomeArea.classList.remove("has-media");
          q.textContent = "🤝 Draw!";
          q.className = "quip";
        }

        called.textContent = predictedRight ? "🔮 Called it! I predicted your " + EMOJI[youMove] + " 😼" : "";

        var handYou = document.getElementById("handYou");
        var handAi = document.getElementById("handAi");
        var actionPill = document.getElementById("actionPill");
        var impactFx = document.getElementById("impactFx");
        var winAura = document.getElementById("winAura");

        // Flush layout so freshly inserted fighter elements have accurate bounding rects on Mobile Safari
        var slotYou = handYou.parentElement.getBoundingClientRect();
        var slotAi = handAi.parentElement.getBoundingClientRect();
        var gapPx = Math.max(82, Math.abs((slotAi.left + slotAi.width / 2) - (slotYou.left + slotAi.width / 2)));

        if (actionPill) {
          animateRaf(actionPill, [
            { o: 0, s: 0.92, op: 0, ease: "out" },
            { o: 0.45, s: 1.04, op: 1, ease: "out" },
            { o: 1, s: 1, op: 1 }
          ], 320, false);
        }

        if (result === "draw") {
          var bump = gapPx * 0.36;
          animateRaf(handYou, [
            { o: 0, tx: -10, ty: 0, s: 0.92, rot: 0, ease: "out" },
            { o: 0.36, tx: bump, ty: -4, s: 1.24, rot: 14, ease: "out" },
            { o: 1, tx: 0, ty: 0, s: 1, rot: 0 }
          ], 460, false);

          animateRaf(handAi, [
            { o: 0, tx: 10, ty: 0, s: 0.92, rot: 0, ease: "out" },
            { o: 0.36, tx: -bump, ty: -4, s: 1.24, rot: -14, ease: "out" },
            { o: 1, tx: 0, ty: 0, s: 1, rot: 0 }
          ], 460, false);
          return;
        }

        var dir = result === "you" ? 1 : -1; // +1 = You strike right; -1 = AI strikes left
        var winEl = result === "you" ? handYou : handAi;
        var loseEl = result === "you" ? handAi : handYou;
        var vsCenter = document.getElementById("vsCenter");
        var dur = 780;
        var winFrames, loseFrames, shakeFrames;

        if (winnerMove === 0) {
          // ROCK CRUSHES SCISSORS: big meteor leap -> colossal smash + squash -> double press -> proud 1.36x bounce
          var crushX = gapPx * 0.95;
          winFrames = [
            { o: 0, tx: 0, ty: 0, sx: 1.05, sy: 1.05, rot: 0, ease: "out" },
            { o: 0.17, tx: -dir * 20, ty: -22, sx: 1.24, sy: 1.24, rot: -dir * 28, ease: "out" },
            { o: 0.36, tx: dir * crushX, ty: 6, sx: 1.82, sy: 1.54, rot: dir * 30, ease: "out" },
            { o: 0.47, tx: dir * (crushX * 0.94), ty: -6, sx: 1.62, sy: 1.62, rot: dir * 16, ease: "in" },
            { o: 0.58, tx: dir * crushX, ty: 9, sx: 1.74, sy: 1.52, rot: dir * 26, ease: "out" },
            { o: 0.84, tx: 0, ty: -6, sx: 1.45, sy: 1.45, rot: -dir * 4, ease: "out" },
            { o: 1, tx: 0, ty: -2, sx: 1.36, sy: 1.36, rot: 0 }
          ];
          loseFrames = [
            { o: 0, tx: 0, ty: 0, sx: 1, sy: 1, rot: 0, op: 1 },
            { o: 0.33, tx: 0, ty: 0, sx: 1, sy: 1, rot: 0, op: 1, ease: "out" },
            { o: 0.41, tx: dir * 18, ty: 16, sx: 1.56, sy: 0.28, rot: dir * 38, op: 0.85, ease: "out" },
            { o: 0.61, tx: dir * 22, ty: 15, sx: 1.48, sy: 0.25, rot: dir * 44, op: 0.52, ease: "out" },
            { o: 1, tx: dir * 12, ty: 7, sx: 0.76, sy: 0.76, rot: dir * 28, op: 0.42 }
          ];
          shakeFrames = [
            { o: 0, tx: 0, ty: 0 },
            { o: 0.34, tx: 0, ty: 0 },
            { o: 0.39, tx: dir * 7, ty: 6 },
            { o: 0.45, tx: -dir * 5, ty: -4 },
            { o: 0.59, tx: dir * 5, ty: 5 },
            { o: 0.66, tx: -dir * 2, ty: -2 },
            { o: 0.76, tx: 0, ty: 0 },
            { o: 1, tx: 0, ty: 0 }
          ];
        } else if (winnerMove === 1) {
          // PAPER COVERS ROCK: billows huge -> blankets Rock at 1.84x -> energetic smother shake -> proud 1.36x bounce
          var coverX = gapPx * 1.0;
          winFrames = [
            { o: 0, tx: 0, ty: 0, s: 1.05, rot: 0, ease: "out" },
            { o: 0.17, tx: -dir * 16, ty: -24, s: 1.3, rot: -dir * 18, ease: "out" },
            { o: 0.36, tx: dir * coverX, ty: -4, s: 1.84, rot: dir * 15, ease: "inout" },
            { o: 0.49, tx: dir * coverX, ty: 2, s: 1.78, rot: -dir * 12, ease: "inout" },
            { o: 0.61, tx: dir * coverX, ty: 3, s: 1.74, rot: dir * 9, ease: "out" },
            { o: 0.85, tx: 0, ty: -6, s: 1.45, rot: -dir * 4, ease: "out" },
            { o: 1, tx: 0, ty: -2, s: 1.36, rot: 0 }
          ];
          loseFrames = [
            { o: 0, tx: 0, ty: 0, s: 1, rot: 0, op: 1 },
            { o: 0.32, tx: 0, ty: 0, s: 0.96, rot: 0, op: 1, ease: "out" },
            { o: 0.44, tx: 0, ty: 12, s: 0.42, rot: -dir * 14, op: 0.14, ease: "inout" },
            { o: 0.62, tx: dir * 4, ty: 11, s: 0.46, rot: dir * 12, op: 0.18, ease: "out" },
            { o: 1, tx: dir * 10, ty: 7, s: 0.76, rot: -dir * 14, op: 0.42 }
          ];
          shakeFrames = [
            { o: 0, tx: 0, ty: 0 },
            { o: 0.34, tx: 0, ty: 0 },
            { o: 0.4, tx: dir * 4, ty: 4 },
            { o: 0.5, tx: -dir * 3, ty: -2 },
            { o: 0.65, tx: 0, ty: 0 },
            { o: 1, tx: 0, ty: 0 }
          ];
        } else {
          // SCISSORS SLICES PAPER: deep sword draw -> twin X-slash combo across Paper -> proud 1.36x bounce
          var sliceX = gapPx * 1.02;
          winFrames = [
            { o: 0, tx: 0, ty: 0, s: 1.05, rot: 0, ease: "out" },
            { o: 0.16, tx: -dir * 22, ty: 8, s: 1.18, rot: dir * 42, ease: "out" },
            { o: 0.34, tx: dir * sliceX, ty: -8, s: 1.68, rot: dir * 112, ease: "inout" },
            { o: 0.48, tx: dir * (sliceX * 0.74), ty: 6, s: 1.62, rot: dir * 52, ease: "inout" },
            { o: 0.6, tx: dir * (sliceX * 0.96), ty: -2, s: 1.66, rot: dir * 96, ease: "out" },
            { o: 0.85, tx: 0, ty: -6, s: 1.45, rot: -dir * 5, ease: "out" },
            { o: 1, tx: 0, ty: -2, s: 1.36, rot: 0 }
          ];
          loseFrames = [
            { o: 0, tx: 0, ty: 0, skx: 0, sx: 1, sy: 1, rot: 0, op: 1 },
            { o: 0.31, tx: 0, ty: 0, skx: 0, sx: 1, sy: 1, rot: 0, op: 1, ease: "out" },
            { o: 0.4, tx: dir * 18, ty: -6, skx: -dir * 38, sx: 1.05, sy: 0.78, rot: dir * 22, op: 0.82, ease: "inout" },
            { o: 0.54, tx: -dir * 8, ty: 5, skx: dir * 28, sx: 0.86, sy: 0.86, rot: -dir * 14, op: 0.62, ease: "out" },
            { o: 1, tx: dir * 16, ty: 9, skx: 0, sx: 0.76, sy: 0.76, rot: dir * 34, op: 0.42 }
          ];
          shakeFrames = [
            { o: 0, tx: 0, ty: 0 },
            { o: 0.32, tx: 0, ty: 0 },
            { o: 0.37, tx: dir * 5, ty: -3 },
            { o: 0.52, tx: -dir * 5, ty: 3 },
            { o: 0.66, tx: 0, ty: 0 },
            { o: 1, tx: 0, ty: 0 }
          ];
        }

        animateRaf(arena, shakeFrames, dur, false);
        animateRaf(winEl, winFrames, dur, true);
        animateRaf(loseEl, loseFrames, dur, true);

        if (winAura) {
          animateRaf(winAura, [
            { o: 0, s: 0.6, op: 0 },
            { o: 0.68, s: 0.8, op: 0, ease: "out" },
            { o: 0.85, s: 1.35, op: 1, ease: "out" },
            { o: 1, s: 1.18, op: 0.85 }
          ], dur, true);
        }

        if (vsCenter) {
          animateRaf(vsCenter, [
            { o: 0, op: 1 },
            { o: 0.22, op: 0.12 },
            { o: 0.66, op: 0.12 },
            { o: 1, op: 1 }
          ], dur, false);
        }

        if (impactFx) {
          animateRaf(impactFx, [
            { o: 0, s: 0.4, rot: -12, op: 0 },
            { o: 0.31, s: 0.5, rot: -8, op: 0, ease: "out" },
            { o: 0.41, s: 1.38, rot: 8, op: 1, ease: "out" },
            { o: 0.56, s: 1.18, rot: -6, op: 0.92, ease: "out" },
            { o: 0.78, s: 1.68, rot: 12, op: 0 },
            { o: 1, s: 1.68, rot: 12, op: 0 }
          ], dur, false);
        }

        if (result === "ai" && !mediaWrap.hidden) {
          animateRaf(mediaWrap, [
            { o: 0, s: 0.88, op: 0, ease: "out" },
            { o: 0.7, s: 1.03, op: 1, ease: "out" },
            { o: 1, s: 1, op: 1 }
          ], 280, false);
        }
      }

      // KEY FUNCTION: decay every count, then add the new observation.
      function update(c, move) {
        for (var i = 0; i < counts.length; i++) counts[i] -= counts[i] >> DECAY_SHIFT;
        counts[3 * c + move] += INCREMENT;
      }

      // Most likely player move for situation c, or null if nothing learned yet.
      function predict(c) {
        var row = counts.slice(3 * c, 3 * c + 3);
        var best = Math.max(row[0], row[1], row[2]);
        return best === 0 ? null : row.indexOf(best);
      }

      // The computer commits its move BEFORE the player moves.
      function startRound() {
        guess = ctx === null ? null : predict(ctx);
        ai = guess === null ? Math.floor(Math.random() * 3) : counter(guess);
      }

      function newGame() {
        clearActiveAnims();
        counts = new Array(27).fill(0);
        ctx = null;
        score = { you: 0, draw: 0, ai: 0 };
        results = [];
        startRound();
        var finalEl = document.getElementById("final");
        var arena = document.getElementById("arena");
        finalEl.hidden = true;
        finalEl.classList.remove("has-cutscene");
        document.getElementById("finalMedia").hidden = true;
        arena.hidden = false;
        arena.className = "arena";
        document.getElementById("moves").hidden = false;
        document.getElementById("faces").innerHTML = "<span class=\"idle-hands\">✊ ✋ ✌️</span>";
        document.getElementById("aiMediaWrap").hidden = true;
        document.getElementById("outcomeArea").classList.remove("has-media");
        var q = document.getElementById("quip");
        q.textContent = "Pick a move to start.";
        q.className = "quip";
        document.getElementById("called").textContent = "";
        render();
      }

      function render() {
        var done = results.length;
        document.getElementById("sYou").textContent = score.you;
        document.getElementById("sDraw").textContent = score.draw;
        document.getElementById("sAi").textContent = score.ai;
        document.getElementById("roundLabel").textContent =
          done < MAX_ROUNDS ? "Round " + (done + 1) + " of " + MAX_ROUNDS : "Game over";
        document.getElementById("barFill").style.width = (100 * done / MAX_ROUNDS) + "%";
      }

      function play(you) {
        if (results.length >= MAX_ROUNDS) return;
        var result = you === ai ? "draw" : (you === counter(ai) ? "you" : "ai");
        score[result]++;
        results.push(result);

        var line = result === "ai" ? pick(AI_WIN_LINES) : (result === "you" ? pick(AI_LOSE_LINES) : "");
        showRoundClash(you, ai, result, line, guess === you);

        if (ctx !== null) update(ctx, you);   // learn: last round's situation led to this move
        ctx = 3 * you + ai;                    // this round is the next situation
        render();

        if (results.length >= MAX_ROUNDS) {
          document.getElementById("moves").hidden = true;
          finishTimer = setTimeout(function () {
            finishTimer = 0;
            finish();
          }, 820);
        } else {
          startRound();
        }
      }

      function aiWinRate(from, to) {
        var part = results.slice(from, to), n = 0;
        part.forEach(function (r) { if (r === "ai") n++; });
        return Math.round(100 * n / part.length);
      }

      // Fold the battlefield (#arena) closed and unfold #final in its exact slot
      function foldArenaIntoFinal(aiWonMatch) {
        clearActiveAnims();

        var arena = document.getElementById("arena");
        var finalEl = document.getElementById("final");
        var finalMedia = document.getElementById("finalMedia");
        var finalDetails = document.getElementById("finalDetails");
        var finalImg = document.getElementById("finalAiImg");

        if (aiWonMatch) {
          finalImg.src = AI_FINAL_WIN_MEDIA.src;
          finalImg.alt = AI_FINAL_WIN_MEDIA.alt;
          finalMedia.hidden = false;
          finalEl.classList.add("has-cutscene");
          finalMedia.style.opacity = "0";
          if (finalDetails) finalDetails.style.opacity = "0";
        } else {
          finalMedia.hidden = true;
          finalEl.classList.remove("has-cutscene");
        }

        var revealed = false;
        function revealFinalStage() {
          if (revealed) return;
          revealed = true;
          if (finishTimer) {
            clearTimeout(finishTimer);
            finishTimer = 0;
          }
          resetStageInlineStyles();
          arena.hidden = true;
          finalEl.hidden = false;
          animateRaf(finalEl, [
            { o: 0, persp: 920, rx: 32, s: 0.96, op: 0, ease: "out" },
            { o: 1, persp: 920, rx: 0, s: 1, op: 1 }
          ], 320, false);
          if (aiWonMatch) {
            startRabbitGunslingerCutscene();
          }
        }

        if (!arena.hidden) {
          var cs = window.getComputedStyle(arena);
          var startH = arena.offsetHeight;
          var ptNum = parseFloat(cs.paddingTop) || 16;
          var pbNum = parseFloat(cs.paddingBottom) || 14;
          var bwNum = parseFloat(cs.borderTopWidth) || 1;
          arena.style.minHeight = "0px";
          animateRaf(arena, [
            { o: 0, h: startH, pt: ptNum, pb: pbNum, bw: bwNum, persp: 920, rx: 0, sx: 1, sy: 1, op: 1, ease: "inout" },
            { o: 0.48, h: Math.round(startH * 0.58), pt: ptNum, pb: pbNum, bw: bwNum, persp: 920, rx: -48, sx: 1, sy: 0.62, op: 0.64, ease: "in" },
            { o: 1, h: 0, pt: 0, pb: 0, bw: 0, persp: 920, rx: -86, sx: 1, sy: 0.02, op: 0 }
          ], 360, true, revealFinalStage);
          finishTimer = setTimeout(function () {
            finishTimer = 0;
            revealFinalStage();
          }, 460);
        } else {
          revealFinalStage();
        }
      }

      function finish() {
        document.getElementById("moves").hidden = true;
        var aiWonMatch = score.ai > score.you;
        var title = score.you > score.ai ? "You beat the AI 🎉" : (aiWonMatch ? "The AI wins 😈" : "It's a tie 🤝");
        document.getElementById("finalTitle").textContent = title;
        document.getElementById("finalScore").textContent =
          "You " + score.you + " · Draw " + score.draw + " · AI " + score.ai;
        document.getElementById("finalLearn").textContent =
          "AI win rate: first 10 rounds " + aiWinRate(0, 10) + "% → last 10 rounds " + aiWinRate(MAX_ROUNDS - 10, MAX_ROUNDS) + "%";

        var finalQuipText = score.you > score.ai ? pick(AI_LOSE_LINES) : (aiWonMatch ? pick(AI_WIN_LINES) : "");
        document.getElementById("finalQuip").textContent = finalQuipText;

        foldArenaIntoFinal(aiWonMatch);
      }

      try {
        document.getElementById("moves").addEventListener("click", function (e) {
          var b = e.target.closest("button[data-move]");
          if (b) play(Number(b.dataset.move));
        });
        document.getElementById("again").addEventListener("click", newGame);
        document.addEventListener("keydown", function (e) {
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          var k = e.key.toLowerCase();
          if (k === "r") play(0); else if (k === "p") play(1); else if (k === "s") play(2);
        });

        newGame();
      } catch (err) {
        console.error("Adaptive RPS initialization error:", err);
      }
    })();
  </script>
