<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Adaptive RPS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
  <style>
    /* =========================================================================
       Theme Tokens & Automatic System Color Scheme
       ========================================================================= */
    :root {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-subtle: #f5f8fb;
      --fg: #14202b;
      --muted: #5b6b79;
      --line: #d5dde5;
      --accent: #1456d6;
      --accent-soft: rgba(20, 86, 214, 0.1);
      --accent-fg: #ffffff;
      --good: #12805c;
      --good-soft: rgba(18, 128, 92, 0.12);
      --bad: #c2362b;
      --bad-soft: rgba(194, 54, 43, 0.12);
      --font-display: "Space Grotesk", system-ui, sans-serif;
      --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --ease-out-strong: cubic-bezier(0.22, 1, 0.36, 1);
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e151c;
        --surface: #17212b;
        --surface-subtle: #1d2a36;
        --fg: #e8eef4;
        --muted: #93a3b2;
        --line: #2a3846;
        --accent: #6b9bff;
        --accent-soft: rgba(107, 155, 255, 0.14);
        --accent-fg: #0b1220;
        --good: #46c79a;
        --good-soft: rgba(70, 199, 154, 0.15);
        --bad: #ff7d72;
        --bad-soft: rgba(255, 125, 114, 0.15);
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0e151c;
      --surface: #17212b;
      --surface-subtle: #1d2a36;
      --fg: #e8eef4;
      --muted: #93a3b2;
      --line: #2a3846;
      --accent: #6b9bff;
      --accent-soft: rgba(107, 155, 255, 0.14);
      --accent-fg: #0b1220;
      --good: #46c79a;
      --good-soft: rgba(70, 199, 154, 0.15);
      --bad: #ff7d72;
      --bad-soft: rgba(255, 125, 114, 0.15);
      color-scheme: dark;
    }

    /* =========================================================================
       Base Reset, Safe-Area Insets & Full-Viewport Responsive Centering
       ========================================================================= */
    * {
      box-sizing: border-box;
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 var(--font-body);
      -webkit-text-size-adjust: 100%;
    }

    /* Dedicated inner scroll container so iOS Safari & Google Sites iframes
       (even with scrolling="no") always scroll smoothly from top to bottom */
    .scroll-shell {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y pinch-zoom;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: max(clamp(12px, 2.2dvh, 24px), env(safe-area-inset-top, 0px));
      padding-bottom: max(clamp(28px, 5dvh, 48px), calc(env(safe-area-inset-bottom, 0px) + 24px));
      padding-left: max(clamp(12px, 4vw, 24px), env(safe-area-inset-left, 0px));
      padding-right: max(clamp(12px, 4vw, 24px), env(safe-area-inset-right, 0px));
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* =========================================================================
       Fluid Main Layout Container
       ========================================================================= */
    .wrap {
      width: 100%;
      max-width: clamp(300px, 94vw, 624px);
      margin: auto;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 2vh, 16px);
    }

    .col-left,
    .col-right {
      display: contents;
    }

    header {
      text-align: center;
    }

    h1 {
      font: 700 clamp(22px, 6vw, 30px)/1.1 var(--font-display);
      margin: 0;
      letter-spacing: -0.01em;
    }

    .tag {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: clamp(12.5px, 3.4vw, 14.5px);
      line-height: 1.4;
    }

    /* =========================================================================
       Scoreboard
       ========================================================================= */
    .score {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(6px, 2vw, 10px);
    }

    .score div {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: clamp(8px, 1.4dvh, 11px) clamp(8px, 2.5vw, 12px);
      text-align: center;
    }

    .score b {
      display: block;
      font: 700 clamp(20px, 5.8vw, 26px)/1.1 var(--font-display);
      font-variant-numeric: tabular-nums;
    }

    .score span {
      font-size: clamp(11px, 2.8vw, 12px);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* =========================================================================
       Last-Round Battle Arena + Winner Strike Choreography
       ========================================================================= */
    .arena {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: clamp(15px, 2.6dvh, 22px) clamp(14px, 4vw, 24px);
      text-align: center;
      min-height: clamp(260px, 33dvh, 306px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(10px, 1.8dvh, 15px);
      overflow: hidden;
      transform-origin: top center;
      will-change: transform, opacity;
      transition: border-color 200ms ease;
    }

    .arena.outcome-ai {
      border-color: var(--bad);
      border-color: color-mix(in srgb, var(--bad) 42%, var(--line));
    }

    .arena.outcome-you {
      border-color: var(--good);
      border-color: color-mix(in srgb, var(--good) 42%, var(--line));
    }

    .faces {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 5.5vw, 44px);
      font-size: clamp(42px, 11.5vw, 62px);
      line-height: 1.1;
      min-height: clamp(98px, 14dvh, 120px);
      padding-block: 8px 4px;
      user-select: none;
    }

    .idle-hands {
      letter-spacing: 0.06em;
    }

    .fighter {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 70px;
      z-index: 1;
    }

    .fighter.is-winner {
      z-index: 5;
    }

    .fighter small {
      font: 700 clamp(10.5px, 2.8vw, 11.5px)/1 var(--font-body);
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .fighter.is-winner small {
      color: var(--fg);
    }

    .stage-slot {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5em;
      height: 1.4em;
    }

    .winner-aura {
      position: absolute;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(250, 204, 21, 0.34) 0%, rgba(250, 204, 21, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .hand {
      position: relative;
      z-index: 1;
      display: inline-block;
      transform-origin: center center;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    .fighter.is-winner .hand {
      -webkit-transform: scale(1.36);
      transform: scale(1.36);
      text-shadow: 0 8px 14px rgba(0, 0, 0, 0.22);
    }

    .fighter.is-loser .hand {
      -webkit-transform: scale(0.76);
      transform: scale(0.76);
      opacity: 0.42;
    }

    .vs-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 64px;
      z-index: 2;
    }

    .faces .vs {
      font: 600 clamp(12px, 3.2vw, 13.5px)/1 var(--font-body);
      color: var(--muted);
    }

    .action-pill {
      font: 700 11px/1.1 var(--font-body);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--surface-subtle);
      border: 1px solid var(--line);
      color: var(--muted);
      white-space: nowrap;
      will-change: transform, opacity;
    }

    .action-pill.pill-you {
      color: var(--good);
      background: var(--good-soft);
      border-color: transparent;
    }

    .action-pill.pill-ai {
      color: var(--bad);
      background: var(--bad-soft);
      border-color: transparent;
    }

    /* Matchup Impact Visual Effects (Double Shockwave, Wrap Ring, Twin X-Slash) */
    .impact-fx {
      position: absolute;
      inset: -18px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      z-index: 6;
      will-change: transform, opacity;
    }

    .impact-ring {
      position: absolute;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 3px solid var(--accent);
    }

    .impact-ring-outer {
      position: absolute;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: 2px dashed #fbbf24;
    }

    .impact-ring.ring-crush {
      border-color: #f59e0b;
    }

    .impact-ring.ring-cover {
      border-color: var(--accent);
      border-style: dashed;
    }

    .impact-slash {
      position: absolute;
      width: 88px;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #ff4d4d, #fde047, transparent);
      transform: rotate(-36deg);
    }

    .impact-slash-alt {
      position: absolute;
      width: 78px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #fb923c, #ffffff, transparent);
      transform: rotate(36deg);
    }

    .impact-badge {
      position: relative;
      font-size: 28px;
      line-height: 1;
    }

    /* =========================================================================
       Round Outcome + Smug AI Win GIF / JPEG Banner
       ========================================================================= */
    .outcome-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 104px;
    }

    .outcome-area.has-media {
      background: var(--surface-subtle);
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 9px 13px;
      text-align: left;
      justify-content: flex-start;
    }

    .rabbit-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 13;
    }

    .ai-media-wrap {
      position: relative;
      z-index: 12;
      flex-shrink: 0;
      width: 102px;
      height: 102px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #ffffff;
      will-change: transform, opacity;
    }

    .ai-media-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .outcome-copy {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      flex: 1;
    }

    .outcome-area:not(.has-media) .outcome-copy {
      align-items: center;
      text-align: center;
    }

    .quip {
      font: 600 clamp(14.5px, 4vw, 18px)/1.3 var(--font-display);
      margin: 0;
      min-height: 1.3em;
    }

    .quip.win {
      color: var(--bad);
    }

    .quip.lose {
      color: var(--good);
    }

    .called {
      margin: 0;
      font-size: clamp(12px, 3.2vw, 13.5px);
      color: var(--accent);
      font-weight: 600;
      min-height: 1.3em;
    }

    .outcome-area.has-media .called:empty {
      display: none;
    }

    /* =========================================================================
       Ergonomic Move Controls (Touch & Keyboard Friendly)
       ========================================================================= */
    .moves {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(8px, 2.5vw, 12px);
    }

    .moves button {
      font: 600 clamp(13px, 3.5vw, 14.5px) var(--font-body);
      color: var(--fg);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: clamp(10px, 1.8dvh, 14px) 4px clamp(8px, 1.4dvh, 10px);
      min-height: clamp(72px, 11dvh, 94px);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: transform 140ms var(--ease-out-strong), border-color 150ms ease;
    }

    .moves button .e {
      font-size: clamp(28px, 8.5vw, 38px);
      line-height: 1.2;
    }

    .moves button kbd {
      font: 500 11px var(--font-body);
      color: var(--muted);
    }

    @media (hover: hover) and (pointer: fine) {
      .moves button:hover {
        border-color: var(--accent);
      }
    }

    .moves button:active {
      transform: scale(0.97);
      border-color: var(--accent);
    }

    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    @media (pointer: coarse) {
      .moves button kbd {
        display: none;
      }
    }

    /* =========================================================================
       Round Progress Bar
       ========================================================================= */
    .progress {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: clamp(11.5px, 3.1vw, 13px);
      color: var(--muted);
    }

    .bar {
      height: 8px;
      background: var(--line);
      border-radius: 4px;
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 220ms var(--ease-out-strong);
    }

    /* =========================================================================
       End-of-Game Summary Card (Replaces Folded Battlefield)
       ========================================================================= */
    .final {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: clamp(16px, 2.6dvh, 22px) clamp(14px, 4vw, 24px);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.4dvh, 11px);
      transform-origin: top center;
      will-change: transform, opacity;
    }

    .final.has-cutscene {
      min-height: clamp(410px, 56dvh, 486px);
      border-color: color-mix(in srgb, var(--bad) 42%, var(--line));
    }

    .final-media {
      position: relative;
      z-index: 12;
      width: min(244px, 72%);
      aspect-ratio: 950 / 935;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #fffafa;
      will-change: transform, opacity;
    }

    .final-media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .final-details {
      position: relative;
      z-index: 11;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(7px, 1.3dvh, 10px);
      width: 100%;
      will-change: opacity, transform;
    }

    .final h2 {
      font: 700 clamp(19px, 5vw, 23px) var(--font-display);
      margin: 0;
    }

    .final p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(13px, 3.4vw, 14.5px);
    }

    .final .learn {
      color: var(--fg);
      font-size: clamp(13.5px, 3.6vw, 15px);
      font-variant-numeric: tabular-nums;
    }

    .final button {
      font: 600 15px var(--font-body);
      background: var(--accent);
      color: var(--accent-fg);
      border: 0;
      border-radius: 10px;
      padding: 11px 24px;
      min-height: 44px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: transform 140ms var(--ease-out-strong), opacity 150ms ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .final button:hover {
        opacity: 0.92;
      }
    }

    .final button:active {
      transform: scale(0.97);
    }

    .note {
      font-size: clamp(11px, 2.9vw, 12px);
      line-height: 1.4;
      color: var(--muted);
      text-align: center;
      margin: 0;
    }

    /* =========================================================================
       Large Screens & Tablets (>= 768px)
       ========================================================================= */
    @media (min-width: 768px) {
      .wrap {
        max-width: 624px;
        gap: 16px;
      }

      .score div {
        padding: 11px 14px;
      }

      .arena {
        padding: 22px 26px;
        min-height: 296px;
      }

      .outcome-area {
        min-height: 118px;
      }

      .ai-media-wrap {
        width: 112px;
        height: 112px;
      }

      .moves {
        gap: 12px;
      }
    }

    /* =========================================================================
       Portrait Phones (iPhone 13 Pro 390x844, Google Sites Mobile Embeds, SE)
       ========================================================================= */
    @media (max-width: 480px) and (orientation: portrait),
           (max-height: 780px) and (orientation: portrait) {
      .scroll-shell {
        padding-top: max(10px, env(safe-area-inset-top, 0px));
        padding-bottom: max(36px, calc(env(safe-area-inset-bottom, 0px) + 24px));
        padding-left: max(12px, env(safe-area-inset-left, 0px));
        padding-right: max(12px, env(safe-area-inset-right, 0px));
      }

      .wrap {
        gap: 8px;
      }

      h1 {
        font-size: clamp(21px, 5.6vw, 25px);
      }

      .tag {
        margin-top: 2px;
        font-size: 12.5px;
      }

      .score div {
        padding: 6px 8px;
      }

      .score b {
        font-size: 20px;
      }

      .arena {
        min-height: 212px;
        padding: 12px 14px;
        gap: 8px;
      }

      .faces {
        min-height: 72px;
        font-size: 40px;
      }

      .outcome-area {
        min-height: 84px;
      }

      .ai-media-wrap {
        width: 80px;
        height: 80px;
      }

      .moves button {
        min-height: 64px;
        padding: 7px 4px 6px;
      }

      .moves button .e {
        font-size: 28px;
      }

      .final {
        padding: 13px 14px;
        gap: 7px;
      }

      .final.has-cutscene {
        min-height: 352px;
      }

      .final-media {
        width: min(182px, 64%);
      }
    }

    /* =========================================================================
       Landscape Phones (Short & Wide Viewports)
       ========================================================================= */
    @media (orientation: landscape) and (max-height: 540px) {
      .scroll-shell {
        padding-top: max(8px, env(safe-area-inset-top, 0px));
        padding-bottom: max(24px, calc(env(safe-area-inset-bottom, 0px) + 14px));
        padding-left: max(14px, env(safe-area-inset-left, 0px));
        padding-right: max(14px, env(safe-area-inset-right, 0px));
      }

      header {
        text-align: left;
      }

      .wrap {
        max-width: 880px;
        display: grid;
        grid-template-columns: 1.12fr 0.88fr;
        align-items: center;
        gap: 12px 20px;
      }

      .col-left,
      .col-right {
        display: flex;
        flex-direction: column;
        gap: 9px;
        min-width: 0;
      }

      h1 {
        font-size: clamp(20px, 3.2vw, 24px);
      }

      .tag {
        font-size: 12.5px;
        margin-top: 2px;
      }

      .score div {
        padding: 6px 8px;
      }

      .score b {
        font-size: 20px;
      }

      .arena {
        min-height: clamp(196px, 50dvh, 236px);
        padding: 12px 14px;
        gap: 8px;
      }

      .faces {
        font-size: clamp(36px, 9.5dvh, 50px);
        min-height: 68px;
      }

      .outcome-area {
        min-height: 80px;
      }

      .ai-media-wrap {
        width: 78px;
        height: 78px;
      }

      .quip {
        font-size: clamp(13.5px, 2.2vw, 16px);
      }

      .called {
        font-size: 12px;
      }

      .moves {
        gap: 8px;
      }

      .moves button {
        min-height: clamp(68px, 20dvh, 88px);
        padding: 8px 4px;
      }

      .moves button .e {
        font-size: clamp(26px, 7.2dvh, 34px);
      }

      .final {
        padding: 10px 12px;
        gap: 6px;
      }

      .final.has-cutscene {
        min-height: clamp(264px, 68dvh, 326px);
      }

      .final-media {
        width: 148px;
      }

      .final h2 {
        font-size: 18px;
      }

      .final p,
      .final .learn {
        font-size: 12.5px;
      }

      .final button {
        padding: 8px 18px;
        font-size: 14px;
      }

      .note {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="scroll-shell" id="scrollShell">
  <div class="wrap">
    <!-- Left panel in landscape / top elements in portrait -->
    <div class="col-left">
      <header>
        <h1>Adaptive RPS</h1>
        <p class="tag">The more you play, the more it learns your patterns. 🐾</p>
      </header>

      <div class="score" aria-label="Score">
        <div><b id="sYou">0</b><span>You</span></div>
        <div><b id="sDraw">0</b><span>Draw</span></div>
        <div><b id="sAi">0</b><span>AI</span></div>

      // Preload all 8 images so round and end-of-game transitions are instant
      AI_ROUND_WIN_MEDIA.concat([AI_FINAL_WIN_MEDIA]).forEach(function (item) {
        var img = new Image();

      function counter(m) { return (m + 1) % 3; }
      function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

      var counts, ctx, score, results, ai, guess;
      var activeAnims = [];
      var finishTimer = 0;
      var mediaDeck = [];
      var lastDrawnIdx = -1;

      // Shuffle-bag over all 7 round-win stickers so every image appears before any repeat
      function drawRoundWinMedia() {
        if (mediaDeck.length === 0) {
          mediaDeck = [0, 1, 2, 3, 4, 5, 6];
          for (var i = mediaDeck.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = mediaDeck[i];
            mediaDeck[i] = mediaDeck[j];
            mediaDeck[j] = tmp;
          }
          // Avoid back-to-back repeat across deck boundaries
          if (mediaDeck[mediaDeck.length - 1] === lastDrawnIdx) {
            var swap = mediaDeck[0];
            mediaDeck[0] = mediaDeck[mediaDeck.length - 1];
            mediaDeck[mediaDeck.length - 1] = swap;
          }
        }
        lastDrawnIdx = mediaDeck.pop();
        return AI_ROUND_WIN_MEDIA[lastDrawnIdx];
      }

      function resetStageInlineStyles() {
        var arena = document.getElementById("arena");
        if (arena) {
          arena.style.height = "";
          arena.style.minHeight = "";
          arena.style.paddingTop = "";
          arena.style.paddingBottom = "";

      // Polyfill CanvasRenderingContext2D.roundRect for older Mobile Safari (< iOS 16)
      if (typeof CanvasRenderingContext2D !== "undefined" && !CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, radii) {
          var r = typeof radii === "number" ? radii : (Array.isArray(radii) ? (radii[0] || 0) : 0);
          r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
          this.moveTo(x + r, y);
          this.arcTo(x + w, y, x + w, y + h, r);
          this.arcTo(x + w, y + h, x, y + h, r);
          this.arcTo(x, y + h, x, y, r);
          this.arcTo(x, y, x + w, y, r);

      function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function easeOutCubic(t) { var u = 1 - clamp01(t); return 1 - u * u * u; }
      function easeInOutQuad(t) {
        t = clamp01(t);
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

      function drawStarSparkle(ctx, x, y, r, color) {
        if (r <= 0.5) return;
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = color;
        ctx.strokeStyle = "#18181b";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        for (var i = 0; i < 8; i++) {
          var ang = (i * Math.PI) / 4;
          var rad = i % 2 === 0 ? r : r * 0.34;
          var px = Math.cos(ang) * rad;
          var py = Math.sin(ang) * rad;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      // Procedurally generate a crisp cartoon Coca-Cola or Pepsi aluminum soda can
      function drawSodaCan(ctx, brand, x, y, angle, scale, hitAge) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.scale(scale, scale);

        var hw = 11.5;
        var hh = 18.5;
        var dent = hitAge >= 0 ? Math.min(1, hitAge / 0.055) : 0;
        var pinch = dent * 4.8;

        function traceCanBody() {
          ctx.beginPath();
          ctx.moveTo(-hw, -hh + 3);
          ctx.quadraticCurveTo(0, -hh - 1.8, hw, -hh + 3);
          ctx.quadraticCurveTo(hw - pinch * 1.15, 0, hw, hh - 3);
          ctx.quadraticCurveTo(0, hh + 2.2, -hw, hh - 3);
          ctx.quadraticCurveTo(-hw + pinch * 0.75, 0, -hw, -hh + 3);
          ctx.closePath();
        }

        // Clip & fill cylinder artwork
        ctx.save();
        traceCanBody();
        ctx.clip();

        if (brand === "coke") {
          // Coca-Cola crimson red cylinder + signature white dynamic wave ribbon
          ctx.fillStyle = "#dc2626";
          ctx.fillRect(-hw - 2, -hh - 2, (hw + 2) * 2, (hh + 2) * 2);

          // Flowing white Coca-Cola dynamic ribbon
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 3.1;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(-hw - 2, 9.5);
          ctx.bezierCurveTo(-4, 10, 3, -8, hw + 2, -7.5);
          ctx.stroke();

          ctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(-hw - 2, 12.5);
          ctx.bezierCurveTo(-3, 13, 4, -5, hw + 2, -4.5);
          ctx.stroke();

          // Crisp white Coke script badge
          ctx.fillStyle = "#ffffff";
          ctx.font = "700 7.2px 'Space Grotesk', system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("Coke", 0, -2.5);
        } else {
          // Pepsi royal blue cylinder + iconic red/white/blue Pepsi globe
          ctx.fillStyle = "#1d4ed8";
          ctx.fillRect(-hw - 2, -hh - 2, (hw + 2) * 2, (hh + 2) * 2);

          // Pepsi circular globe emblem
          var gy = -3.4;
          var gr = 6.6;
          ctx.save();
          ctx.beginPath();
          ctx.arc(0, gy, gr, 0, Math.PI * 2);
          ctx.fillStyle = "#ffffff";
          ctx.fill();
          ctx.clip();

          // Top crimson dome wave
          ctx.fillStyle = "#ef4444";
          ctx.beginPath();
          ctx.moveTo(-gr - 2, gy - gr - 2);
          ctx.lineTo(gr + 2, gy - gr - 2);
          ctx.lineTo(gr + 2, gy - 2.2);
          ctx.bezierCurveTo(2, gy - 5.2, -2, gy + 1.8, -gr - 2, gy + 0.8);
          ctx.closePath();
          ctx.fill();

          // Bottom deep-navy wave
          ctx.fillStyle = "#172554";
          ctx.beginPath();
          ctx.moveTo(-gr - 2, gy + gr + 2);
          ctx.lineTo(gr + 2, gy + gr + 2);
          ctx.lineTo(gr + 2, gy + 0.8);
          ctx.bezierCurveTo(2, gy - 1.2, -2, gy + 5.2, -gr - 2, gy + 3.8);
          ctx.closePath();
          ctx.fill();
          ctx.restore();

          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.arc(0, gy, gr, 0, Math.PI * 2);
          ctx.stroke();

          // Bold white PEPSI wordmark
          ctx.fillStyle = "#ffffff";
          ctx.font = "700 5.9px 'Space Grotesk', system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("PEPSI", 0, 9.2);
        }

        // Brushed aluminum top & bottom rims
        ctx.fillStyle = "#e2e8f0";
        ctx.fillRect(-hw - 2, -hh - 2, (hw + 2) * 2, 4.6);
        ctx.fillStyle = "#cbd5e1";
        ctx.fillRect(-hw - 2, hh - 3.2, (hw + 2) * 2, 5.2);

        // Specular left highlight & right cel-shadow for 3D cylindrical pop
        ctx.fillStyle = "rgba(255, 255, 255, 0.24)";
        ctx.fillRect(-hw + 2, -hh, 3.6, hh * 2);
        ctx.fillStyle = "rgba(15, 23, 42, 0.22)";
        ctx.fillRect(hw - 4.4, -hh, 4.4, hh * 2);
        ctx.restore();

        // Crisp ink outline around cylinder
        ctx.strokeStyle = "#18181b";
        ctx.lineWidth = 2.1;
        ctx.lineJoin = "round";
        traceCanBody();
        ctx.stroke();

        // Top aluminum lid ellipse + pull-tab detail
        ctx.fillStyle = "#f1f5f9";
        ctx.beginPath();
        ctx.ellipse(0, -hh + 2.6, hw - 0.6, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.ellipse(1.5, -hh + 2.6, 3.2, 1.1, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Bullet puncture hole & dent creases after shot impact
        if (dent > 0.05) {
          ctx.fillStyle = "#18181b";
          ctx.beginPath();
          ctx.arc(1.2, -0.5, 2.5 * dent, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#e2e8f0";
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(-3.5, -3.5);
          ctx.lineTo(4.5, 2.5);
          ctx.moveTo(4.2, -3.8);
          ctx.lineTo(-2.5, 3.2);
          ctx.stroke();
        }

        ctx.restore();
      }

      // Draw a crisp cartoon revolver pointing left when angle === 0
      function drawRevolver(ctx, x, y, angle, scale, spinBlur) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        if (spinBlur > 0) {
          ctx.save();
          ctx.strokeStyle = "rgba(148, 163, 184, " + (0.65 * spinBlur).toFixed(2) + ")";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(-6, 0, 22, 0.3, Math.PI * 1.65);
          ctx.stroke();
          ctx.strokeStyle = "rgba(250, 204, 21, " + (0.55 * spinBlur).toFixed(2) + ")";
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.arc(-6, 0, 16, Math.PI * 0.8, Math.PI * 2.1);
          ctx.stroke();
          ctx.restore();
        }

        ctx.rotate(angle);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#18181b";
        ctx.lineWidth = 2.4;

        // Wooden grip curving down-right
        ctx.fillStyle = "#92400e";
        ctx.beginPath();
        ctx.moveTo(2, 1);
        ctx.lineTo(10, 2);
        ctx.quadraticCurveTo(13, 10, 9, 16);
        ctx.lineTo(2, 14);
        ctx.quadraticCurveTo(3, 7, 2, 1);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Trigger guard
        ctx.beginPath();
        ctx.arc(-2, 7, 4.5, 0, Math.PI);
        ctx.stroke();

        // Frame & long barrel pointing left (-x)
        ctx.fillStyle = "#cbd5e1";
        ctx.beginPath();
        ctx.roundRect(-30, -5.5, 34, 6.5, 2);
        ctx.fill();
        ctx.stroke();

        // Front sight at barrel tip
        ctx.fillStyle = "#334155";
        ctx.beginPath();
        ctx.moveTo(-29, -5.5);
        ctx.lineTo(-26, -9);
        ctx.lineTo(-24, -5.5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Revolving cylinder
        ctx.fillStyle = "#64748b";
        ctx.beginPath();
        ctx.roundRect(-11, -6.5, 12, 9.5, 2.5);
        ctx.fill();
        ctx.stroke();

        // Cylinder flute line
        ctx.beginPath();
        ctx.moveTo(-9, -2);
        ctx.lineTo(-1, -2);
        ctx.stroke();

        // Hammer
        ctx.beginPath();
        ctx.moveTo(4, -4);
        ctx.lineTo(8, -8);
        ctx.stroke();

        ctx.restore();
      }

      // Render one frame of the 7-act Pink Rabbit Soda-Can Gunslinger Cutscene on #final at elapsed seconds `t`
      function renderRabbitCutsceneFrame(t) {
        var finalEl = document.getElementById("final");
        var cvs = document.getElementById("rabbitCanvas");
        var mediaWrap = document.getElementById("finalMedia");
        var detailsEl = document.getElementById("finalDetails");
        if (!finalEl || !cvs || !mediaWrap || finalEl.hidden) return true;

        var W = finalEl.clientWidth;
        var H = finalEl.clientHeight;
        if (W < 20 || H < 20) return true;

        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var cw = Math.round(W * dpr);
        var ch = Math.round(H * dpr);
        if (cvs.width !== cw || cvs.height !== ch) {
          cvs.width = cw;
          cvs.height = ch;
        }
        var ctx = cvs.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);

        // Timeline anchors (seconds after Summary Card opens)
        var tStart = 0.18;      // Stage unfold settles
        var tRollEnd = 0.78;    // Act 1: Roll in from right edge
        var shotTimes = [1.18, 1.50, 1.82, 2.14]; // Act 2: 4 sky-high shots at Coca-Cola & Pepsi cans
        var tShootEnd = 2.48;
        var tBlowEnd = 3.22;    // Act 3: Mouth blows smoke from gun barrel
        var tTrickEnd = 3.88;   // Act 4: Revolver 3x circle spin trick
        var tWaistEnd = 4.26;   // Act 5: Holster revolver back at waist
        var tStepEnd = 4.88;    // Act 6: Turn to screen & step onto #finalMedia ending sticker
        var tDone = 5.34;       // Act 7: Ending "adios..." sticker overlaps directly onto the rabbit!

        if (t < tStart) {
          mediaWrap.style.opacity = "0";
          if (detailsEl) detailsEl.style.opacity = "0";
          return false;
        }

        if (t >= tDone) {
          ctx.clearRect(0, 0, W, H);
          mediaWrap.style.opacity = "1";
          mediaWrap.style.webkitTransform = "";
          mediaWrap.style.transform = "";
          mediaWrap.style.filter = "";
          if (detailsEl) {
            detailsEl.style.opacity = "1";
            detailsEl.style.webkitTransform = "";
            detailsEl.style.transform = "";
          }
          return true;
        }

        // Keep summary text clear during sky-shooting acts, then smoothly reveal during Act 6-7
        if (detailsEl) {
          if (t < tWaistEnd + 0.12) {
            detailsEl.style.opacity = "0";
          } else {
            var pDet = easeOutCubic(clamp01((t - (tWaistEnd + 0.12)) / 0.68));
            detailsEl.style.opacity = pDet.toFixed(3);
            var detTf = "translate3d(0, " + ((1 - pDet) * 6).toFixed(1) + "px, 0)";
            detailsEl.style.webkitTransform = detTf;
            detailsEl.style.transform = detTf;
          }
        }

        // Transform-invariant destination coordinates of #finalMedia ("adios..." ending sticker)
        var mW = mediaWrap.offsetWidth;
        var mH = mediaWrap.offsetHeight;
        var stickCX = mediaWrap.offsetLeft + mW * 0.5;
        var stickCY = mediaWrap.offsetTop + mH * 0.5;

        // Character scale & ground geometry:
        // In local rabbit coordinates, soles of feet = +38, ear tips = -62 => total height = 100 * S
        var S = Math.min(0.84, Math.max(0.48, H / 535));
        var charH = 100 * S;
        var groundY = H - Math.max(18, 26 * S);
        var standX = W * 0.74;
        var standY = groundY - 38 * S;

        // 4 Alternating Coca-Cola & Pepsi Cans thrown ~2.5x character height into the sky!
        var canSpecs = [
          { brand: "coke",  tThrow: 0.68, tHit: shotTimes[0], x0: W * 0.18, xHit: W * 0.27, hMult: 2.50, spin:  2.2, vxOut: -68 },
          { brand: "pepsi", tThrow: 0.98, tHit: shotTimes[1], x0: W * 0.34, xHit: W * 0.42, hMult: 2.65, spin: -2.4, vxOut: -52 },
          { brand: "coke",  tThrow: 1.30, tHit: shotTimes[2], x0: W * 0.14, xHit: W * 0.23, hMult: 2.58, spin:  2.5, vxOut: -78 },
          { brand: "pepsi", tThrow: 1.62, tHit: shotTimes[3], x0: W * 0.38, xHit: W * 0.47, hMult: 2.46, spin: -2.1, vxOut: -44 }
        ];

        // Compute live positions of all 4 cans for both drawing & dynamic skyward gun tracking
        var canStates = [];
        for (var ci = 0; ci < canSpecs.length; ci++) {
          var sp = canSpecs[ci];
          var apexY = Math.max(36 * S, groundY - sp.hMult * charH);
          var launchY = groundY + 10 * S;
          var cx = sp.xHit;
          var cy = apexY;
          var cRot = 0;
          var visible = false;
          var alpha = 1;
          var hitAge = -1;

          if (t >= sp.tThrow && t < sp.tHit) {
            visible = true;
            var u = clamp01((t - sp.tThrow) / (sp.tHit - sp.tThrow));
            var parabolaUp = 1 - (1 - u) * (1 - u); // True gravity deceleration to sky apex
            cx = lerp(sp.x0, sp.xHit, u);
            cy = lerp(launchY, apexY, parabolaUp);
            cRot = -0.35 + u * sp.spin;
          } else if (t >= sp.tHit && t < sp.tHit + 0.60) {
            visible = true;
            hitAge = t - sp.tHit;
            // Upward + outward impulse when bullet blasts the can in mid-air, followed by gravity
            cx = sp.xHit + sp.vxOut * S * hitAge;
            cy = apexY + (-132 * hitAge + 470 * hitAge * hitAge) * S;
            cRot = -0.35 + sp.spin + hitAge * (sp.spin > 0 ? 13.5 : -13.5);
            if (hitAge > 0.40) {
              alpha = clamp01(1 - (hitAge - 0.40) / 0.20);
            }
          }

          canStates.push({
            spec: sp,
            apexX: sp.xHit,
            apexY: apexY,
            launchY: launchY,
            x: cx,
            y: cy,
            rot: cRot,
            visible: visible,
            alpha: alpha,
            hitAge: hitAge
          });
        }

        var rx = standX;
        var ry = standY;
        var bodyScale = S;
        var rollAngle = 0;
        var isRolling = false;
        var yaw = -1; // -1 = facing left; 0 = facing screen (front)
        var stepPhase = 0;
        var holstered = t >= 4.10;
        var canvasAlpha = 1;
        var expression = "shoot";

        // Act 1: Roll in from right edge (-360 deg counter-clockwise somersault)
        if (t < tRollEnd) {
          var pRoll = (t - tStart) / (tRollEnd - tStart);
          var eRoll = easeOutCubic(pRoll);
          rx = lerp(W + 46, standX, eRoll);
          var hop = pRoll > 0.78 ? -Math.sin(((pRoll - 0.78) / 0.22) * Math.PI) * 10 * S : 0;
          ry = standY + hop;
          if (pRoll < 0.82) {
            isRolling = true;
            rollAngle = -easeInOutQuad(pRoll / 0.82) * Math.PI * 2;
          }
          expression = "roll";
        } else if (t < tShootEnd) {
          expression = "shoot";
        } else if (t < tBlowEnd) {
          expression = "blow";
        } else if (t < tTrickEnd) {
          expression = "trick";
        } else if (t < tWaistEnd) {
          expression = "smug";
        } else {
          // Act 6 & 7: Turn to screen, step onto #finalMedia ending sticker, and overlap!
          expression = "front";
          var pTurn = clamp01((t - tWaistEnd) / 0.24);
          yaw = lerp(-1, 0, easeInOutQuad(pTurn));

          var pWalk = clamp01((t - (tWaistEnd + 0.08)) / (tStepEnd - (tWaistEnd + 0.08)));
          stepPhase = pWalk;

          var pMove = easeInOutQuad(pWalk);
          var targetScale = Math.max(S * 1.35, mH / 118);
          bodyScale = lerp(S, targetScale, pMove);

          // Geometrically center full-body rabbit [-62, +38] squarely inside #finalMedia
          var destX = stickCX;
          var destY = stickCY + 12 * targetScale;
          var stepBob = pWalk > 0 && pWalk < 1 ? -Math.sin(pWalk * Math.PI) * 16 * S : 0;
          rx = lerp(standX, destX, pMove);
          ry = lerp(standY, destY, pMove) + stepBob;
        }

        // Control ending sticker (#finalMedia) crossfade while rabbit overlays on top in Act 7
        if (t < tStepEnd - 0.08) {
          mediaWrap.style.opacity = "0";
        } else {
          var pOverlap = clamp01((t - (tStepEnd - 0.08)) / 0.34);
          var op = easeOutCubic(pOverlap);
          mediaWrap.style.opacity = op.toFixed(3);
          var mTf = "scale(" + lerp(0.95, 1, op).toFixed(3) + ")";
          mediaWrap.style.webkitTransform = mTf;
          mediaWrap.style.transform = mTf;
          mediaWrap.style.filter = "";
          if (t > tDone - 0.26) {
            canvasAlpha = clamp01((tDone - t) / 0.26);
          }
        }

        // Compute gun recoil kick across the 4 sky shots
        var recoilKick = 0;
        for (var si = 0; si < shotTimes.length; si++) {
          var dtS = t - shotTimes[si];
          if (dtS >= 0 && dtS < 0.24) {
            var k = dtS < 0.045 ? (dtS / 0.045) : Math.max(0, 1 - (dtS - 0.045) / 0.195);
            recoilKick = Math.max(recoilKick, k);
          }
        }
        rx += recoilKick * 3.8 * S;
        ry += recoilKick * 1.6 * S;

        // Compute dynamic skyward aim target so revolver tracks each rising Pepsi / Coca-Cola can
        var aimTargetX = canStates[0].x;
        var aimTargetY = canStates[0].y;
        if (t >= shotTimes[0] && t < shotTimes[1]) {
          var tr1 = easeInOutQuad(clamp01((t - shotTimes[0]) / 0.16));
          aimTargetX = lerp(canStates[0].apexX, canStates[1].x, tr1);
          aimTargetY = lerp(canStates[0].apexY, canStates[1].y, tr1);
        } else if (t >= shotTimes[1] && t < shotTimes[2]) {
          var tr2 = easeInOutQuad(clamp01((t - shotTimes[1]) / 0.16));
          aimTargetX = lerp(canStates[1].apexX, canStates[2].x, tr2);
          aimTargetY = lerp(canStates[1].apexY, canStates[2].y, tr2);
        } else if (t >= shotTimes[2] && t < shotTimes[3]) {
          var tr3 = easeInOutQuad(clamp01((t - shotTimes[2]) / 0.16));
          aimTargetX = lerp(canStates[2].apexX, canStates[3].x, tr3);
          aimTargetY = lerp(canStates[2].apexY, canStates[3].y, tr3);
        } else if (t >= shotTimes[3]) {
          aimTargetX = canStates[3].apexX;
          aimTargetY = canStates[3].apexY;
        }

        ctx.save();
        ctx.globalAlpha = canvasAlpha;

        // Subtle stage ground line during Acts 1-5
        if (t < tStepEnd) {
          var gAlpha = t < tWaistEnd ? 0.22 : (1 - clamp01((t - tWaistEnd) / 0.45)) * 0.22;
          ctx.strokeStyle = "rgba(148, 163, 184, " + gAlpha.toFixed(2) + ")";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(W * 0.08, groundY + 2 * S);
          ctx.lineTo(W * 0.92, groundY + 2 * S);
          ctx.stroke();
        }

        // 1. Floor dust puffs during Act 1 roll
        if (t < tRollEnd + 0.25) {
          for (var di = 0; di < 5; di++) {
            var td = tStart + di * 0.10;
            var ageD = t - td;
            if (ageD > 0 && ageD < 0.38) {
              var progD = ageD / 0.38;
              var dxP = lerp(W + 24, standX + 10, di / 4) + progD * 14;
              var dyP = standY + 34 * S - progD * 8;
              ctx.fillStyle = "rgba(148, 163, 184, " + ((1 - progD) * 0.55).toFixed(2) + ")";
              ctx.beginPath();
              ctx.arc(dxP, dyP, (6 + progD * 9) * S, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        // 2. Upward throw whoosh streaks + Thrown Coca-Cola & Pepsi Cans in the sky (~2.5x rabbit height)
        for (var ci2 = 0; ci2 < canStates.length; ci2++) {
          var cs = canStates[ci2];
          var throwAge = t - cs.spec.tThrow;
          if (throwAge >= 0 && throwAge < 0.22) {
            var wProg = throwAge / 0.22;
            ctx.strokeStyle = "rgba(148, 163, 184, " + ((1 - wProg) * 0.55).toFixed(2) + ")";
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(cs.spec.x0 - 5 * S, groundY - wProg * 28 * S);
            ctx.lineTo(cs.spec.x0 - 3 * S, groundY - (18 + wProg * 46) * S);
            ctx.moveTo(cs.spec.x0 + 5 * S, groundY - wProg * 22 * S);
            ctx.lineTo(cs.spec.x0 + 6 * S, groundY - (14 + wProg * 42) * S);
            ctx.stroke();
          }
          if (cs.visible && cs.alpha > 0.02) {
            ctx.save();
            ctx.globalAlpha = canvasAlpha * cs.alpha;
            drawSodaCan(ctx, cs.spec.brand, cs.x, cs.y, cs.rot, 1.08 * S, cs.hitAge);
            ctx.restore();
          }
        }

        // 3. Ground shadow beneath rabbit
        ctx.fillStyle = "rgba(20, 32, 43, 0.14)";
        ctx.beginPath();
        ctx.ellipse(rx, ry + 38 * bodyScale, 24 * bodyScale, 5.5 * bodyScale, 0, 0, Math.PI * 2);
        ctx.fill();

        // Track world-space muzzle coordinates for Act 2 sky gunfire VFX
        var muzzleWorldX = rx - 46 * bodyScale;
        var muzzleWorldY = ry - 20 * bodyScale;
        var activeGunAngle = 0;

        // 4. Draw Pink Rabbit Character
        ctx.save();
        ctx.translate(rx, ry);
        ctx.scale(bodyScale, bodyScale);

        var PINK = "#f8b7ce";
        var PINK_SHADOW = "#d795ae";
        var INK = "#18181b";
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = INK;
        ctx.lineWidth = 2.8;

        if (isRolling) {
          // Tucked somersaulting pink rabbit ball + tucked twin ears
          ctx.rotate(rollAngle);
          ctx.fillStyle = PINK;
          ctx.beginPath();
          ctx.arc(0, 4, 24, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = PINK;
          ctx.beginPath();
          ctx.ellipse(-6, -22, 6, 15, -0.35, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.beginPath();
          ctx.ellipse(6, -21, 6, 15, -0.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(0, 4, 13, 0.4, Math.PI * 1.4);
          ctx.stroke();
          ctx.restore();
        } else {
          var crouch = (t < tShootEnd) ? 2.5 : 0;
          var earLag = recoilKick * 0.20;
          var lookUpMix = (expression === "shoot") ? 1 : 0;

          // Back arm
          var frontMix = 1 + yaw;
          ctx.fillStyle = PINK_SHADOW;
          ctx.beginPath();
          var lArmX = lerp(-12, -22, frontMix);
          var lArmY = lerp(4, 14, frontMix) + crouch;
          ctx.ellipse(lArmX, lArmY, 6.5, 14, lerp(0.45, 0.2, frontMix), 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Legs (animate swagger step forward during Act 6)
          var leftLegLift = stepPhase > 0 && stepPhase < 1 ? Math.sin(stepPhase * Math.PI) * 12 : 0;
          var leftLegFwd = stepPhase > 0 ? easeOutCubic(stepPhase) * 4 : 0;

          ctx.fillStyle = PINK_SHADOW;
          ctx.beginPath();
          ctx.roundRect(4, 20 + crouch, 11, 17 - crouch * 0.4, 5.5);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = PINK;
          ctx.beginPath();
          ctx.roundRect(-14 - leftLegFwd * 0.3, 20 + crouch - leftLegLift, 11.5, 17.5, 5.5);
          ctx.fill();
          ctx.stroke();

          // Plump pink bunny torso
          ctx.fillStyle = PINK;
          ctx.beginPath();
          ctx.moveTo(-17, -4 + crouch);
          ctx.quadraticCurveTo(-21, 14 + crouch, -16, 25 + crouch);
          ctx.quadraticCurveTo(0, 29 + crouch, 17, 25 + crouch);
          ctx.quadraticCurveTo(21, 14 + crouch, 16, -4 + crouch);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = PINK_SHADOW;
          ctx.beginPath();
          ctx.ellipse(lerp(4, 0, frontMix), -1 + crouch, 12, 5.5, 0, 0, Math.PI);
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(-17, -4 + crouch);
          ctx.quadraticCurveTo(-21, 14 + crouch, -16, 25 + crouch);
          ctx.quadraticCurveTo(0, 29 + crouch, 17, 25 + crouch);
          ctx.quadraticCurveTo(21, 14 + crouch, 16, -4 + crouch);
          ctx.closePath();
          ctx.stroke();

          // Gun Belt around waist + Hip Holster
          var beltY = 18 + crouch;
          ctx.fillStyle = "#27272a";
          ctx.beginPath();
          ctx.roundRect(-18, beltY, 36, 5.5, 2.5);
          ctx.fill();
          ctx.stroke();

          var buckleX = lerp(-13, -3.5, frontMix);
          ctx.fillStyle = "#fbbf24";
          ctx.beginPath();
          ctx.roundRect(buckleX, beltY - 0.8, 7, 7, 1.5);
          ctx.fill();
          ctx.stroke();

          var holX = lerp(4, 13, frontMix);
          var holY = beltY + 2;
          if (holstered) {
            ctx.fillStyle = "#92400e";
            ctx.beginPath();
            ctx.roundRect(holX + 1, holY - 7, 7, 9, 2);
            ctx.fill();
            ctx.stroke();
          }
          ctx.fillStyle = "#3f3f46";
          ctx.beginPath();
          ctx.roundRect(holX, holY, 9, 13, 2.5);
          ctx.fill();
          ctx.stroke();

          // Twin Iconic Pink Rabbit Ears + Head (tilts slightly skyward during Act 2!)
          var headY = -21 + crouch;
          ctx.save();
          ctx.translate(0, headY);
          ctx.rotate(lookUpMix * 0.14 + earLag * 0.25);

          ctx.save();
          ctx.translate(0, -16);
          ctx.rotate(earLag);
          ctx.fillStyle = PINK_SHADOW;
          ctx.beginPath();
          ctx.ellipse(-5.5, -13, 5.8, 16, -0.08, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = PINK;
          ctx.beginPath();
          ctx.ellipse(5.5, -13, 5.8, 16, 0.08, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();

          // Plump Round-Cheeked Head
          ctx.fillStyle = PINK;
          ctx.beginPath();
          ctx.ellipse(0, 0, 20.5, 19.5, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.save();
          ctx.beginPath();
          ctx.ellipse(0, 0, 20.5, 19.5, 0, 0, Math.PI * 2);
          ctx.clip();
          ctx.fillStyle = PINK_SHADOW;
          ctx.beginPath();
          ctx.ellipse(0, -10, 23, 12, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.beginPath();
          ctx.ellipse(0, 0, 20.5, 19.5, 0, 0, Math.PI * 2);
          ctx.stroke();

          var faceShiftX = yaw * 8.5;
          var eyeY = -3 - lookUpMix * 1.4;

          if (expression === "blow") {
            ctx.beginPath();
            ctx.moveTo(faceShiftX - 9, eyeY - 4);
            ctx.quadraticCurveTo(faceShiftX - 5, eyeY - 7, faceShiftX - 1, eyeY - 4);
            ctx.moveTo(faceShiftX + 3, eyeY - 4);
            ctx.quadraticCurveTo(faceShiftX + 7, eyeY - 7, faceShiftX + 11, eyeY - 4);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(faceShiftX - 5, eyeY + 1, 3.5, Math.PI * 1.1, Math.PI * 1.9);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(faceShiftX + 7, eyeY + 1, 3.5, Math.PI * 1.1, Math.PI * 1.9);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(faceShiftX, eyeY + 1);
            ctx.lineTo(faceShiftX - 1.5, eyeY + 7);
            ctx.lineTo(faceShiftX + 1.5, eyeY + 7.5);
            ctx.stroke();

            ctx.fillStyle = "#fb7185";
            ctx.beginPath();
            ctx.ellipse(faceShiftX - 5, 9.5, 3.2, 3.8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          } else {
            var e1x = faceShiftX - 6.5;
            var e2x = faceShiftX + 6.5;
            var pupilShiftX = yaw * 1.6;
            var pupilShiftY = -lookUpMix * 0.9;

            ctx.beginPath();
            ctx.moveTo(e1x - 4, eyeY - 5.5);
            ctx.lineTo(e1x + 3.5, eyeY - 4.5);
            ctx.moveTo(e2x - 3.5, eyeY - 4.5);
            ctx.lineTo(e2x + 4, eyeY - 5.5);
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.ellipse(e1x, eyeY, 4.3, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(e2x, eyeY, 4.3, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = INK;
            ctx.beginPath();
            ctx.arc(e1x + pupilShiftX, eyeY + pupilShiftY, 1.7, 0, Math.PI * 2);
            ctx.arc(e2x + pupilShiftX, eyeY + pupilShiftY, 1.7, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(faceShiftX, eyeY + 1);
            ctx.lineTo(faceShiftX - 1.2, eyeY + 7.5);
            ctx.lineTo(faceShiftX + 2, eyeY + 8);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(faceShiftX - 4.5, 10.5);
            ctx.quadraticCurveTo(faceShiftX + 1, 12.5, faceShiftX + 6, 9);
            ctx.stroke();
          }
          ctx.restore(); // end head space

          // Front Right Arm + Sky-Tracking Revolver Choreography across Acts 2 -> 7
          var shoulderX = lerp(6, 17, frontMix);
          var shoulderY = 1 + crouch;
          var handX, handY, gunAngle = 0, spinBlur = 0, drawGun = !holstered;

          // Exact skyward aim angle from rabbit's shooting hand to active flying soda can
          var baseHandWorldX = rx - 20 * bodyScale;
          var baseHandWorldY = ry - 8 * bodyScale;
          var dxSky = aimTargetX - baseHandWorldX;
          var dySky = aimTargetY - baseHandWorldY;
          var skyAimAngle = Math.atan2(-dySky, -dxSky);
          skyAimAngle = Math.max(0.28, Math.min(1.22, skyAimAngle));

          if (t < tShootEnd) {
            // Act 2: Aim upward into the sky tracking each Pepsi & Coca-Cola can + recoil kick!
            var kickAng = recoilKick * 0.34;
            handX = -19 + recoilKick * 3.5;
            handY = -9 + crouch - recoilKick * 6.5;
            gunAngle = skyAimAngle + kickAng;
          } else if (t < tBlowEnd) {
            // Act 3: Bring smoking barrel right beside puckered mouth
            var pLift = easeInOutQuad(clamp01((t - tShootEnd) / 0.24));
            handX = lerp(-19, -16, pLift);
            handY = lerp(-9 + crouch, 2, pLift);
            gunAngle = lerp(skyAimAngle, 1.18, pLift);
          } else if (t < tTrickEnd) {
            // Act 4: Revolver 3x Circle Spin Trick
            var pSpin = (t - tBlowEnd) / (tTrickEnd - tBlowEnd);
            var extendP = easeOutCubic(clamp01(pSpin / 0.18));
            handX = lerp(-16, -24, extendP);
            handY = lerp(2, 0, extendP);
            var spinProg = clamp01((pSpin - 0.10) / 0.76);
            gunAngle = lerp(1.18, 0, extendP) - easeInOutQuad(spinProg) * Math.PI * 6;
            spinBlur = (spinProg > 0 && spinProg < 1) ? Math.sin(spinProg * Math.PI) : 0;
          } else if (t < tWaistEnd) {
